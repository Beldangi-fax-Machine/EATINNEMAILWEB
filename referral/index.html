<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Eat-Inn with Referral Code</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/blackfavicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/blackfavicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/blackfavicon/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/icons/blackfavicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/whitefavicons/favicon-32x32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/whitefavicons/favicon-16x16.png" media="(prefers-color-scheme: dark)">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --bg-input: #222222;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --text-muted: #737373;
            --accent-primary: #ffffff;
            --accent-green: #22c55e;
            --border: rgba(255,255,255,0.08);
            --border-hover: rgba(255,255,255,0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .bg-effects {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
        }

        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            top: -200px; left: -200px;
        }

        .orb-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            bottom: -100px; right: -100px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--text-secondary));
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 20px;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .code-display {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-hover);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 32px;
        }

        .code-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .code-value {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }

        .benefits {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            text-align: left;
        }

        .benefit {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .benefit:last-child {
            margin-bottom: 0;
        }

        .benefit-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 32px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 255, 255, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .expiry-note {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .expiry-time {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            color: #FCA5A5;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: var(--bg-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 24px;
            }

            h1 {
                font-size: 24px;
            }

            .code-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-effects">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <img src="/icons/whiteicon.png" alt="Eat-Inn">
            </div>

            <div id="content">
                <!-- Content injected by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // Extract referral code from URL
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('code');

        const contentDiv = document.getElementById('content');

        if (!referralCode) {
            // No code provided
            contentDiv.innerHTML = `
                <div class="error-message">
                    <strong>Missing Referral Code</strong><br>
                    This link is missing a referral code.
                </div>
                <h1>Download Eat-Inn</h1>
                <p class="subtitle">Transform your ingredients into delicious recipes</p>
                <a href="https://apps.apple.com/app/eat-inn/id6739009346" class="btn">
                    Download on App Store
                </a>
            `;
        } else {
            // Valid code - show referral info
            contentDiv.innerHTML = `
                <h1>You've Been Invited!</h1>
                <p class="subtitle">Join Eat-Inn and get bonus tokens</p>

                <div class="code-display">
                    <div class="code-label">Referral Code</div>
                    <div class="code-value">${referralCode}</div>
                </div>

                <div class="benefits">
                    <div class="benefit">
                        <div class="benefit-icon">+10</div>
                        <div>Get <strong>10 bonus tokens</strong> when you sign up</div>
                    </div>
                    <div class="benefit">
                        <div class="benefit-icon">AI</div>
                        <div>Generate AI recipes from your ingredients</div>
                    </div>
                    <div class="benefit">
                        <div class="benefit-icon">+</div>
                        <div>Track nutrition and plan meals</div>
                    </div>
                </div>

                <button id="openAppBtn" class="btn">
                    <span id="btnText">Open Eat-Inn</span>
                    <span id="btnLoading" style="display: none;"><span class="loading"></span></span>
                </button>

                <p class="expiry-note">
                    This code expires in <span class="expiry-time">20 minutes</span>
                </p>
            `;

            // Handle deep link
            const openAppBtn = document.getElementById('openAppBtn');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');

            openAppBtn.addEventListener('click', () => {
                // Show loading
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-block';

                // Try to open app with deep link
                const deepLink = `eatinn://referral?code=${referralCode}`;
                const appStoreLink = 'https://apps.apple.com/app/eat-inn/id6739009346';

                // Attempt to open app
                window.location.href = deepLink;

                // Fallback to App Store after 2 seconds if app doesn't open
                setTimeout(() => {
                    // Check if user is still on page (app didn't open)
                    if (document.hasFocus()) {
                        window.location.href = appStoreLink;
                    }
                }, 2000);
            });

            // Auto-redirect after 3 seconds
            setTimeout(() => {
                openAppBtn.click();
            }, 3000);
        }
    </script>
</body>
</html>
